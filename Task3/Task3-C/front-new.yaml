apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-new
  labels:
    app: front-new
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-new
  template:
    metadata:
      labels:
        app: front-new
    spec:
      containers:
      - name: front-new
        image: front-new:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: persist
          mountPath: /front-new
      volumes:
      - name: persist
        persistentVolumeClaim:
          claimName: persist
---
apiVersion: v1
kind: Service
metadata:
  name: front-new
spec:
  selector:
    app: front-new
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort

