version: "3.9"

services:
  model:
    build: model
    ports:
      - "8080:8080"
    networks:
      - model-network
    volumes:
      - persist:/model
  py-expo:
    build: py-expo
    ports:
      - "8600:8600"
    networks:
      - model-network
    depends_on:
      - model
    volumes:
      - persist:/py-expo
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - py-expo
    networks:
      - model-network
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - model-network
      
volumes:
  persist:
  grafana-storage:

networks:
  model-network:
